<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop+ | NBA Performance Analytics</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e9eef9}
*{box-sizing:border-box}body{margin:0}header{background:#111b31;border-bottom:1px solid #283755;padding:22px max(24px,5vw);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:850;letter-spacing:-1px}.logo b{color:#62b4ff}main{max-width:1350px;margin:auto;padding:32px 24px}h1{margin:0 0 8px;font-size:28px}p{color:#aab8d0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
button,select,input{background:#17243d;color:#e9eef9;border:1px solid #344762;border-radius:9px;padding:11px 14px;font:inherit}button{cursor:pointer}button.active{background:#215b9c;border-color:#70b6ff}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input{min-width:220px;flex:1}.controls select{min-width:150px}
.panel{border:1px solid #2c3b59;border-radius:12px;background:#101b30;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #263650;white-space:nowrap}th{background:#1c2d49;cursor:pointer;position:sticky;top:0}tr:hover{background:#1b2942}
.game{margin:24px 0}.game h2{font-size:18px;margin:0;padding:16px;background:#192d4d}.muted{font-size:13px;color:#aab8d0}.pill{padding:6px 10px;background:#183452;border-radius:18px}
.team-logo{width:27px;height:27px;object-fit:contain;vertical-align:middle;margin-right:7px}.player-photo{width:35px;height:35px;object-fit:cover;border-radius:50%;background:#24334b;vertical-align:middle;margin-right:8px}.person-cell{display:inline-flex;align-items:center;gap:3px}</style></head><body>
<header><div class="logo">Prop<b>+</b></div><div class="muted" id="updated">NBA performance analytics · Daily refresh 8:00 AM ET</div></header>
<main><div style="display:flex;gap:10px;margin-bottom:20px"><a href="/" style="padding:11px 18px;background:#215b9c;color:white;border-radius:9px;text-decoration:none">NBA</a><a href="/nfl.html" style="padding:11px 18px;background:#17243d;color:#e9eef9;border:1px solid #344762;border-radius:9px;text-decoration:none">NFL</a><a href="/cfb.html" style="padding:11px 18px;background:#17243d;color:#e9eef9;border:1px solid #344762;border-radius:9px;text-decoration:none;margin-left:10px">College Football</a></div><h1>NBA Performance Dashboard</h1><p>Player projections, matchup comparisons, defensive position rankings and team pace. Statistical estimates, not guaranteed outcomes.</p>
<nav id="tabs"><button class="active" data-view="players">All Players</button><button data-view="games">Game by Game</button><button data-view="defense">Defensive Rankings</button><button data-view="pace">Team Pace</button></nav>
<div class="controls"><input id="search" type="search" placeholder="Search players, teams or opponents"><select id="team"><option value="">All teams</option></select><span class="pill" id="count">Loading…</span></div>
<section id="content" aria-live="polite"></section></main>
<script>
const sources={players:"data/nba_player_projections.csv",defense:"data/nba_defense_by_position.csv",pace:"data/nba_team_pace.csv"};
const playerIds={};const state={view:"players",search:"",team:"",sort:"",desc:false,data:{}};
function csv(text){let rows=[],row=[],value="",quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=""}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(Boolean))rows.push(row);row=[];value=""}else value+=c}if(value||row.length){row.push(value);rows.push(row)}let headers=rows.shift()||[];return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??""])))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const cols={players:[["DATE","Date"],["TEAM_ABBREVIATION","Team"],["OPPONENT","Opponent"],["PLAYER_NAME","Player"],["POSITION","Pos"],["PROJECTED_MIN","Min"],["PROJ_PTS","PTS"],["PROJ_REB","REB"],["PROJ_AST","AST"],["PROJ_FG3M","3PM"],["PROJ_BLK","BLK"],["PROJ_STL","STL"],["PROJ_PRA","PRA"],["EXPECTED_PACE","Pace"]],defense:[["DEFENSE","Team"],["POSITION","Position"],["GAMES","Games"],["RANK_PTS","PTS Rank"],["RANK_REB","REB Rank"],["RANK_AST","AST Rank"],["RANK_FG3M","3PM Rank"],["RANK_BLK","BLK Rank"],["RANK_STL","STL Rank"],["ALLOW_PTS_100","PTS/100"],["ALLOW_REB_100","REB/100"],["ALLOW_AST_100","AST/100"],["ALLOW_FG3M_100","3PM/100"],["ALLOW_STL_100","STL/100"],["ALLOW_BLK_100","BLK/100"]],pace:[["TEAM_ABBREVIATION","Team"],["GAMES","Games"],["PACE","Possessions/Game"]]};
const nbaCodes={BKN:"bkn",BOS:"bos",NYK:"ny",NOP:"no",PHX:"phx",GSW:"gs",SAS:"sa",UTA:"utah"};function nbaLogo(t){return "https://a.espncdn.com/i/teamlogos/nba/500/"+(nbaCodes[t]||String(t).toLowerCase())+".png"}function cell(r,k){let value=esc(r[k]);if(k==="TEAM_ABBREVIATION"||k==="OPPONENT"||k==="DEFENSE"){return '<img class="team-logo" loading="lazy" alt="" src="'+nbaLogo(r[k])+'" onerror="this.style.display=\'none\'">'+value}if(k==="PLAYER_NAME"){let id=r.PLAYER_ID||playerIds[r.PLAYER_NAME];return '<span class="person-cell"><img class="player-photo" loading="lazy" alt="" src="'+(id?("https://cdn.nba.com/headshots/nba/latest/260x190/"+encodeURIComponent(id)+".png"):"/missing-player-photo.png")+'" onerror="this.style.display=\'none\'">'+value+"</span>"}return esc(["PROJECTED_MIN","EXPECTED_PACE","PACE","ALLOW_PTS_100","ALLOW_REB_100","ALLOW_AST_100","ALLOW_FG3M_100","ALLOW_STL_100","ALLOW_BLK_100"].includes(k)&&r[k]!==""?Number(r[k]).toFixed(2):r[k])}
function table(rows,fields){if(!rows.length)return '<p>No matching records available.</p>';return '<div class="panel"><table><thead><tr>'+fields.map(([k,l])=>'<th data-sort="'+esc(k)+'">'+esc(l)+(state.sort===k?(state.desc?' ↓':' ↑'):'')+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+fields.map(([k])=>'<td>'+cell(r,k)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){let view=state.view,rows=state.data[view==="games"?"players":view]||[];let q=state.search.toLowerCase();rows=rows.filter(r=>(!state.team||Object.values(r).includes(state.team))&&(!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q))));if(state.sort)rows=[...rows].sort((a,b)=>{let x=a[state.sort]??"",y=b[state.sort]??"";let nx=Number(x),ny=Number(y);let cmp=x!==""&&y!==""&&!Number.isNaN(nx)&&!Number.isNaN(ny)?nx-ny:String(x).localeCompare(String(y));return state.desc?-cmp:cmp});document.getElementById("count").textContent=rows.length+" records";let el=document.getElementById("content");if(view==="games"){let groups={};for(let r of rows){let key=[r.DATE,...[r.TEAM_ABBREVIATION,r.OPPONENT].sort()].join("|");(groups[key]??=[]).push(r)}el.innerHTML=Object.entries(groups).map(([key,rs])=>'<div class="game"><h2>'+esc(key.split("|").join(" · "))+'</h2>'+table(rs,cols.players)+'</div>').join("")||"<p>No matching games.</p>"}else el.innerHTML=table(rows,cols[view]);el.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{let k=th.dataset.sort;state.desc=state.sort===k?!state.desc:false;state.sort=k;render()})}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.view=b.dataset.view;state.sort="";render()});
document.getElementById("search").oninput=e=>{state.search=e.target.value;render()};
document.getElementById("team").onchange=e=>{state.team=e.target.value;render()};
Promise.all([fetch("data/nba_player_ids.csv?v="+Date.now()).then(r=>r.ok?r.text():"").then(t=>{for(let row of csv(t))if(row.PLAYER_NAME&&row.PLAYER_ID)playerIds[row.PLAYER_NAME]=row.PLAYER_ID}).catch(()=>{}),...Object.entries(sources).map(async([k,url])=>{let r=await fetch(url+"?v="+Date.now());if(!r.ok)throw Error(url+": "+r.status);state.data[k]=csv(await r.text())})]).then(()=>{let teams=[...new Set(state.data.players.map(r=>r.TEAM_ABBREVIATION))].sort();document.getElementById("team").innerHTML='<option value="">All teams</option>'+teams.map(t=>'<option>'+esc(t)+'</option>').join("");render()}).catch(e=>{document.getElementById("content").textContent="Data unavailable: "+e.message;document.getElementById("count").textContent="Data unavailable"});
</script></body></html>
