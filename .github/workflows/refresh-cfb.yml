name: Refresh College Football Analytics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: propplus-cfb-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Refresh verified CFB game data and projections
        run: python scripts/update_cfb.py
      - name: Publish CFB CSV and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb_projections.csv data/cfb_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified college football analytics"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-analytics
          path: |
            data/cfb_projections.csv
            data/cfb_metadata.json
          if-no-files-found: warn
