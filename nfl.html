<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prop+ | NFL Performance Analytics</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e9eef9}*{box-sizing:border-box}body{margin:0}header{background:#111b31;border-bottom:1px solid #283755;padding:22px max(24px,5vw);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:30px;font-weight:850}.logo b{color:#62b4ff}main{max-width:1350px;margin:auto;padding:30px 24px}a{color:#9dcbff}nav{display:flex;gap:10px;margin:18px 0 26px}nav a{padding:11px 18px;background:#17243d;border:1px solid #344762;border-radius:9px;text-decoration:none}nav a.active{background:#215b9c;color:white}h1{font-size:28px}p,.muted{color:#aab8d0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}button,select,input{background:#181818;color:#f5f5f5;border:1px solid #383838;border-radius:9px;padding:11px 14px;font:inherit}button{cursor:pointer}button.active{background:#215b9c}.controls input{flex:1;min-width:180px}.panel{border:1px solid #2c3b59;border-radius:12px;overflow:auto;margin:18px 0}table{border-collapse:collapse;width:100%;min-width:750px;font-size:13px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #263650;white-space:nowrap}th{background:#1c2d49;cursor:pointer}tr:hover{background:#1b2942}.game{margin:22px 0}.game h2{background:#192d4d;padding:16px;font-size:18px;margin:0}.message{padding:20px;border:1px solid #344762;border-radius:10px;background:#101b30}
.team-logo{width:27px;height:27px;object-fit:contain;vertical-align:middle;margin-right:7px}.player-photo{width:35px;height:35px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:8px}
/* Prop+ black and gold identity */
:root{background:#050505;color:#f5f5f5}
html,body{background:#050505;color:#f5f5f5}
header{background:#0c0c0c;border-color:#292929}
.logo b{color:#d4af37}
.panel,section,.message{background:#101010;border-color:#303030}
th{background:#191919}th,td{border-color:#303030}tr:hover{background:#202020}
.game h2{background:#191919}
button,select,input,nav a,.pill{background:#181818;color:#f5f5f5;border-color:#383838}
button.active,nav a.active{background:#3a3014;border-color:#d4af37;color:#f7e6ab}
a{color:#e2c46c}
p,.muted{color:#b6b6b6}

/* Mobile-first enhancements, shared across Prop+ dashboards */
html{-webkit-text-size-adjust:100%}
body{min-width:0}
main{width:100%;max-width:1350px;box-sizing:border-box}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.panel,section{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{font-variant-numeric:tabular-nums}
th,td{vertical-align:middle}
button,select,input{min-height:44px}
.access-label{font-size:12px;color:#d4af37;border:1px solid #6e5a22;border-radius:99px;padding:5px 10px;display:inline-block}
@media(max-width:720px){
 header{padding:14px 16px;align-items:flex-start}
 .logo{font-size:27px}
 main{padding:16px 12px 36px}
 h1{font-size:23px;line-height:1.2}
 nav{margin:14px 0 18px;gap:7px}
 nav a{flex:1 1 auto;padding:10px 11px!important;font-size:13px;text-align:center}
 .controls{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}
 .controls input,.controls select,input#search{width:100%;min-width:0;max-width:none}
 #tabs{display:flex;overflow-x:auto;flex-wrap:nowrap;gap:7px;padding-bottom:7px;-webkit-overflow-scrolling:touch}
 #tabs button,button[data-pos],#games,#scores{flex-shrink:0;white-space:nowrap}
 .panel,section{border-radius:9px}
 table{min-width:680px;font-size:12px}
 th,td{padding:10px 9px}
 .team-logo{width:23px;height:23px}
 .game{margin:15px 0}
 .game h2{padding:12px;font-size:15px}
 .muted{font-size:12px}
}
</style></head><body><header><div class="logo">Prop<b>+</b></div><div class="muted">NFL performance analytics · Weekly projections</div></header><main><nav><a href="/">NBA</a><a href="/nfl.html" class="active">NFL</a><a href="/cfb.html" style="padding:11px 18px;background:#181818;color:#f5f5f5;border:1px solid #383838;border-radius:9px;text-decoration:none;margin-left:0">College Football</a></nav><h1>NFL Player Performance Dashboard</h1><p>Quarterback, running back, wide receiver and tight end projections, with individual game breakdowns. Statistical estimates, not guaranteed outcomes.</p><div class="controls"><button data-pos="ALL" class="active">All Positions</button><button data-pos="QB">QB</button><button data-pos="RB">RB</button><button data-pos="WR">WR</button><button data-pos="TE">TE</button><button id="games">Game by Game</button><button id="scores">Projected Scores</button></div><div class="controls"><input id="search" placeholder="Search players or teams" type="search"><select id="team"><option value="">All teams</option></select><span id="count" class="muted">Loading…</span></div><div class="controls"><label for="scorePeriod">NFL week</label><select id="scorePeriod" onchange="renderScores()"></select></div><section id="content" aria-live="polite"></section><p class="muted">Source: <a href="https://github.com/OnTilt829/NFL-Player-Props">NFL analytics model</a></p></main><script>
const source="https://raw.githubusercontent.com/OnTilt829/NFL-Player-Props/main/output/projections.csv";
const state={rows:[],pos:"ALL",team:"",query:"",games:false,sort:"",desc:true};
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function csv(t){let rows=[],r=[],v="",q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))rows.push(r);r=[];v=""}else v+=c}if(v||r.length){r.push(v);rows.push(r)}let h=rows.shift()||[];return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??""])))}
const common=[["player","Player"],["team","Team"],["opponent","Opponent"]];
const fields={QB:[...common,["passing_yards","Pass Yds"],["passing_tds","Pass TD"],["rushing_yards","Rush Yds"],["rushing_receiving_tds","Rush + Rec TD"]],RB:[...common,["rushing_yards","Rush Yds"],["receiving_yards","Rec Yds"],["receptions","REC"],["rushing_receiving_tds","Rush + Rec TD"]],WR:[...common,["receptions","Receptions"],["receiving_yards","Receiving Yards"],["tds","TDs"]],TE:[...common,["receptions","Receptions"],["receiving_yards","Receiving Yards"],["receiving_tds","Receiving TDs"]]};
const nflCodes={JAC:"jax",LA:"lar",WAS:"wsh"};const photos={};function logo(t){return "https://a.espncdn.com/i/teamlogos/nfl/500/"+(nflCodes[t]||t.toLowerCase())+".png"}function cell(r,k){if(k==="team"||k==="opponent")return '<img class="team-logo" loading="lazy" alt="" src="'+logo(r[k])+'" onerror="this.style.display=\'none\'">'+esc(r[k]);if(k==="player"){let u=photos[r.team+"|"+r.player];return (u?'<img class="player-photo" loading="lazy" alt="" src="'+esc(u)+'" onerror="this.style.display=\'none\'">':"")+esc(r.player)}return esc(r[k])}async function loadPhotos(){await Promise.allSettled([...new Set(state.rows.map(r=>r.team))].map(async team=>{let response=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/"+(nflCodes[team]||team.toLowerCase())+"/roster");if(!response.ok)return;let data=await response.json();for(let group of data.athletes||[])for(let athlete of group.items||[])if(athlete.displayName&&athlete.headshot?.href)photos[team+"|"+athlete.displayName]=athlete.headshot.href}));render()}
function table(rows,cols){if(!rows.length)return '<p>No matching players.</p>';return '<div class="panel"><table><thead><tr>'+cols.map(([k,l])=>'<th data-key="'+esc(k)+'">'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(([k])=>'<td>'+cell(r,k)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){if(state.scoresView){renderScores();return}let r=state.rows.filter(x=>(state.pos==="ALL"||x.position===state.pos)&&(!state.team||x.team===state.team)&&(!state.query||Object.values(x).some(v=>String(v).toLowerCase().includes(state.query))));if(state.sort)r.sort((a,b)=>{let x=a[state.sort]??"",y=b[state.sort]??"",d=Number(x)-Number(y);let v=x!==""&&y!==""&&!isNaN(d)?d:String(x).localeCompare(String(y));return state.desc?-v:v});document.getElementById("count").textContent=r.length+" players";let out="";if(state.games){let groups={};r.forEach(x=>{let k=[x.team,x.opponent].sort().join(" vs ");(groups[k]??=[]).push(x)});out=Object.entries(groups).map(([name,players])=>'<div class="game"><h2>'+esc(name)+'</h2>'+["QB","RB","WR","TE"].map(pos=>'<h3>'+pos+'</h3>'+table(players.filter(x=>x.position===pos),fields[pos])).join("")+'</div>').join("")}else if(state.pos==="ALL"){out=["QB","RB","WR","TE"].map(pos=>'<h2>'+pos+'</h2>'+table(r.filter(x=>x.position===pos),fields[pos])).join("")}else out=table(r,fields[state.pos]);document.getElementById("content").innerHTML=out||'<p>No matching records.</p>';document.querySelectorAll("th[data-key]").forEach(th=>th.onclick=()=>{state.desc=state.sort===th.dataset.key?!state.desc:true;state.sort=th.dataset.key;render()})}
document.querySelectorAll("button[data-pos]").forEach(b=>b.onclick=()=>{state.pos=b.dataset.pos;state.games=false;state.scoresView=false;document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});document.getElementById("games").onclick=e=>{state.games=true;state.scoresView=false;state.pos="ALL";document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");render()};document.getElementById("scores").onclick=e=>{state.scoresView=true;document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");renderScores()};document.getElementById("search").oninput=e=>{state.query=e.target.value.toLowerCase();render()};document.getElementById("team").onchange=e=>{state.team=e.target.value;render()};
fetch(source+"?t="+Date.now()).then(r=>{if(!r.ok)throw Error("NFL projection data has not been published yet");return r.text()}).then(t=>{state.rows=csv(t).filter(x=>["QB","RB","WR","TE"].includes(x.position));document.getElementById("team").innerHTML='<option value="">All teams</option>'+[...new Set(state.rows.map(x=>x.team))].sort().map(t=>'<option>'+esc(t)+'</option>').join("");render();loadPhotos()}).catch(e=>{document.getElementById("count").textContent="Not published";document.getElementById("content").innerHTML='<div class="message">NFL projections are not published yet. Run the NFL model workflow to generate and commit <code>output/projections.csv</code> to the source repository. No player projections are being fabricated.</div>'});

let scoreRows=[],scoreError="";
const scoreDay=r=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.KICKOFF_UTC));
const scoreWeek=r=>{let d=new Date(scoreDay(r)+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+5)%7));return d.toISOString().slice(0,10)};
const scoreEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function scoreTeam(name,id){const valid=/^[0-9]+$/.test(String(id||""));const img=valid?'<img loading="lazy" alt="" style="width:27px;height:27px;object-fit:contain;vertical-align:middle;margin-right:9px" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+id+'.png" onerror="this.style.display=\'none\'">':"";return '<span style="display:inline-flex;align-items:center">'+img+scoreEsc(name)+'</span>'}
function renderScores(){
 const root=document.getElementById("content");
 if(scoreError){root.innerHTML='<p>'+scoreEsc(scoreError)+'</p>';return}
 if(!scoreRows.length){root.innerHTML='<p>Game score projections pending the next scheduled refresh.</p>';return}
 const period=document.getElementById('scorePeriod');period.parentElement.style.display="flex";const visible=scoreRows.filter(r=>scoreWeek(r)===period.value);
 root.innerHTML='<h2>Projected Game Scores</h2><p class="muted">Independent scoring-average matchup model: team points per game and opposing points allowed per game.</p><div class="panel"><table><thead><tr><th>Game time (ET)</th><th>Away</th><th>Home</th><th>Away projected</th><th>Home projected</th><th>Projected total</th></tr></thead><tbody>'+visible.map(r=>{let d=new Date(r.KICKOFF_UTC);let when=isNaN(d)?'TBD':new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d);return '<tr><td>'+scoreEsc(when)+'</td><td>'+scoreTeam(r.AWAY,r.AWAY_ID)+'</td><td>'+scoreTeam(r.HOME,r.HOME_ID)+'</td><td>'+scoreEsc(r.AWAY_PROJ)+'</td><td>'+scoreEsc(r.HOME_PROJ)+'</td><td>'+scoreEsc(r.PROJECTED_TOTAL)+'</td></tr>'}).join("")+'</tbody></table></div>';
}
fetch("data/nfl_game_scores.csv?v="+Date.now()).then(r=>{if(!r.ok)throw Error("Game scores not published yet");return r.text()}).then(t=>{scoreRows=csv(t);const weeks=[...new Set(scoreRows.map(scoreWeek))].sort().reverse();const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});const current=scoreWeek({KICKOFF_UTC:today+'T12:00:00Z'});document.getElementById('scorePeriod').innerHTML=weeks.map(w=>'<option value="'+w+'">Week of '+w+'</option>').join('');document.getElementById('scorePeriod').value=weeks.includes(current)?current:weeks[0]||'';if(state.scoresView)renderScores()}).catch(e=>{scoreError=e.message;if(state.scoresView)renderScores()});
</script></body></html>
